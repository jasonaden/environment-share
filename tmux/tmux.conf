# iTerm2 native integration — keep tmux out of the way
# With tmux -CC, iTerm2 handles UI, clipboard, and mouse natively.

# Allow iTerm2 to set the clipboard via OSC 52
set -g set-clipboard on

# Enable mouse (iTerm2 -CC mode intercepts this natively)
set -g mouse on

# Use the user's default shell (respects chsh setting)
set -g default-shell "$SHELL"

# Increase scrollback (iTerm2 renders this natively)
set -g history-limit 50000

# No escape delay (makes Esc key responsive for vim, etc.)
set -sg escape-time 0

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
